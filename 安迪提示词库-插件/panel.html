<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安迪提示词库</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="5" y="5" width="30" height="30" rx="8" fill="#c0472f"/>
        <rect x="7.6" y="7.6" width="24.8" height="24.8" rx="6" fill="none" stroke="#fff" stroke-width="0.9" stroke-opacity="0.55"/>
        <text x="20" y="27.6" text-anchor="middle" fill="#fff" style="font-family:'Kaiti SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',system-ui,serif;font-size:22px;font-weight:600">安</text>
      </svg>
      <div>
        <h1>安迪提示词库</h1>
        <div class="sub" id="brandsub">高频提示词 · 一键复制</div>
      </div>
    </div>
    <div class="search">
      <svg class="si" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="q" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="grid" aria-label="搜索提示词" title="↑ ↓ 在结果间移动 · Enter 插入高亮项" placeholder="搜标题或内容 · 回车直接用第一条" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn btn-primary" id="addBtn" title="新增提示词（N）" aria-label="新增提示词">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lbl">新增</span>
    </button>
    <div class="menu-wrap">
      <button class="icon-btn" id="dataBtn" title="数据管理" aria-haspopup="true" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="menu" id="dataMenu" hidden>
        <button id="openTabBtn" title="在新标签页打开（大屏编辑）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>在新标签页打开</button>
        <div class="sep"></div>
        <button id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>导出 JSON（备份）</button>
        <button id="importBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M4 21h16"/></svg>导入 JSON（合并）</button>
        <div class="sep"></div>
        <button id="slashBtn" title="点击切换唤起方式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4 9 20"/></svg><span id="slashLbl">网页里唤起：打 //</span></button>
        <button id="viewBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span id="viewLbl">切换为卡片视图</span></button>
        <button id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg><span id="themeLbl">外观：跟随系统</span></button>
        <button id="helpBtn" title="重新查看三步使用引导"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.6 2.6 0 0 1 5 .8c0 1.7-2.6 2-2.6 3.6"/><path d="M12 17.2h.01"/></svg>使用帮助</button>
        <button id="backupBtn" title="硬盘自动备份状态；失败时点一下重试"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10M8 9l4 4 4-4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span id="backupLbl">备份：检查中…</span></button>
        <div class="sep"></div>
        <button class="danger" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg><span id="resetLbl">恢复内置</span></button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="application/json,.json" hidden>
  </div>
</header>

<!-- 备份不健康时才出现的 slim banner；正常时由 JS 保持 hidden -->
<div class="backup-banner" id="backupBanner" hidden>
  <span class="bb-msg" id="backupBannerMsg"></span>
  <button class="btn bb-btn" type="button" id="backupBannerBtn">去设置</button>
</div>

<!-- 首次使用三步引导：andy-onboarded 不存在时显示一次；≡ 菜单「使用帮助」可重开 -->
<div class="onboard" id="onboard" hidden>
  <div class="onb-title">三步开始用</div>
  <ol class="onb-list">
    <li>网页输入框行首打 <code>//</code>，搜索并直接插入。</li>
    <li>任意页面按 <kbd>Alt</kbd> + <kbd>P</kbd> 打开侧边栏。</li>
    <li>网页里 <kbd>Ctrl</kbd> + <kbd>S</kbd> 存草稿，再按 <kbd>Alt</kbd> + <kbd>P</kbd> 确认。</li>
  </ol>
  <div class="onb-actions"><button class="btn btn-primary" type="button" id="onbDismiss">知道了</button></div>
</div>

<main class="wrap">
  <nav class="rail" id="rail" aria-label="分类"></nav>
  <section>
    <div class="meta-line">
      <h2 id="viewTitle">全部提示词</h2>
      <div class="meta-right">
        <span class="count" id="count"></span>
        <select class="sortsel catsel" id="catSel" title="分类"></select>
      </div>
    </div>
    <div class="use-hint" id="useHint" hidden>点整行插入到当前网页 · ▾ 展开全文 · ★ 收藏置顶</div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">新增提示词</h2>
    <div class="field">
      <label for="fTitle">标题</label>
      <input id="fTitle" type="text" placeholder="给这条提示词起个名字（留空自动用内容开头）">
    </div>
    <div class="field">
      <label for="fCat">分类</label>
      <input id="fCat" type="text" list="catList" placeholder="选一个已有分类，或直接输入新分类">
      <datalist id="catList"></datalist>
    </div>
    <div class="field">
      <label for="fContent">提示词内容</label>
      <textarea id="fContent" placeholder="粘贴或输入完整提示词…录入后自动识别标题和分类"></textarea>
      <span class="hint">粘贴内容后自动识别标题和分类，可随时手改；Ctrl+Enter 保存。内容里写 {{股票名}} 这样的占位，用的时候会弹出填空。</span>
    </div>
    <div class="modal-actions">
      <button class="btn ghost star-btn" type="button" id="mStar" title="收藏 = 置顶显示"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17.9 6.8 20.6l1-5.8L3.5 9.7l5.9-.9z"/></svg><span>收藏</span></button>
      <button class="btn ghost" type="button" id="mDetect"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>智能识别</button>
      <span class="sp"></span>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn btn-primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="varOverlay" hidden>
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="varTitle">
    <h2 id="varTitle">填空</h2>
    <div id="varFields"></div>
    <div class="modal-actions">
      <span class="hint" style="font-size:11.5px;color:var(--faint)">Enter 下一项 · 最后一项 Enter 插入 · Esc 返回</span>
      <button class="btn" id="varCancel">取消</button>
      <button class="btn btn-primary" id="varOk">确定</button>
    </div>
  </div>
</div>

<div class="overlay" id="importOverlay" hidden>
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <h2 id="importTitle">导入预览</h2>
    <div class="import-summary" id="importSummary"></div>
    <ol class="import-list" id="importList"></ol>
    <div class="modal-actions">
      <button class="btn" id="importCancel">取消</button>
      <button class="btn btn-primary" id="importOk">确认导入</button>
    </div>
  </div>
</div>

<button class="totop" id="toTop" title="回到顶部" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>顶部
</button>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>
  <span id="toastMsg">已复制到剪贴板</span>
  <button class="toast-action" type="button" id="toastAction" hidden></button>
</div>

<!-- 独立错误条：不会被成功 toast 覆盖，6.5s 自动消失 -->
<div class="toast toast-error" id="toastError" role="alert" aria-live="assertive" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.6 20h18.8L12 3z"/><path d="M12 9v5"/><path d="M12 17.2h.01"/></svg>
  <span id="toastErrorMsg"></span>
</div>

<script src="vars.js"></script>
<script src="panel.js"></script>
</body>
</html>
